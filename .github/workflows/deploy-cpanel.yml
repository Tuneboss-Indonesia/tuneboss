name: Deploy to cPanel

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  NODE_VERSION: 22
  PHP_VERSION: 8.2
  WEB_BUILD_DIR: web-build
  DEPLOY_DIR: deploy
  EXPO_PUBLIC_API_URL: http://tuneboss-landing.dasrams.biz.id/api-inventory/api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Export web build
        run: npx expo export --platform web --output-dir web-build

      - name: Rewrite web build for /inventory
        shell: bash
        run: |
          node <<'EOF'
          const fs = require('fs');
          const path = process.env.WEB_BUILD_DIR;

          function walk(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) =>
              entry.isDirectory() ? walk(`${dir}/${entry.name}`) : [`${dir}/${entry.name}`]
            );
          }

          for (const file of walk(path)) {
            if (!/\.(html|js)$/.test(file)) continue;
            let source = fs.readFileSync(file, 'utf8');
            source = source.replace(/href=\"\/favicon\.ico\"/g, 'href="./favicon.ico"');
            source = source.replace(/src=\"\/_expo\//g, 'src="./_expo/');
            source = source.replace(/\"\/_expo\//g, '"./_expo/');
            source = source.replace(/\"\/assets\//g, '"./assets/');
            fs.writeFileSync(file, source);
          }
          EOF

      - name: Install api dependencies
        working-directory: api
        run: composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader --no-scripts

      - name: Prepare deploy bundle
        shell: bash
        run: |
          rm -rf "${DEPLOY_DIR}"
          mkdir -p "${DEPLOY_DIR}/frontend" "${DEPLOY_DIR}/api-app" "${DEPLOY_DIR}/api-public"
          cp -R "${WEB_BUILD_DIR}/." "${DEPLOY_DIR}/frontend/"
          cp -R api/. "${DEPLOY_DIR}/api-app/"
          cp -R api/public/. "${DEPLOY_DIR}/api-public/"
          find "${DEPLOY_DIR}" -type d -name .git -prune -exec rm -rf {} +
          find "${DEPLOY_DIR}" -type d -name node_modules -prune -exec rm -rf {} +
          find "${DEPLOY_DIR}" -type f \( -name ".env" -o -name ".env.*" -o -name "*.log" -o -name "*.map" \) -delete

      - name: Pack deploy archives
        shell: bash
        run: |
          tar -C "${DEPLOY_DIR}/frontend" -czf "${DEPLOY_DIR}/frontend.tar.gz" .
          tar -C "${DEPLOY_DIR}/api-app" -czf "${DEPLOY_DIR}/api-app.tar.gz" .
          tar -C "${DEPLOY_DIR}/api-public" -czf "${DEPLOY_DIR}/api-public.tar.gz" .

      - name: Start SSH agent
        shell: bash
        env:
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          printf '%s\n' "$CPANEL_SSH_KEY" | ssh-add -

      - name: Add cPanel host key
        shell: bash
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          for attempt in 1 2 3; do
            ssh-keyscan -T 10 -p "$CPANEL_PORT" "$CPANEL_HOST" >> ~/.ssh/known_hosts && exit 0
            sleep $((attempt * 2))
          done
          exit 1

      - name: Ensure remote directories exist
        shell: bash
        run: |
          ssh -p "${{ secrets.CPANEL_SSH_PORT || 22 }}" \
            "${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }}" \
            "mkdir -p '${{ secrets.CPANEL_FRONTEND_DIR }}' '${{ secrets.CPANEL_API_APP_DIR }}' '${{ secrets.CPANEL_API_PUBLIC_DIR }}'"

      - name: Deploy web to /inventory
        shell: bash
        run: |
          scp -P "${{ secrets.CPANEL_SSH_PORT || 22 }}" \
            "${DEPLOY_DIR}/frontend.tar.gz" \
            "${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }}:~/frontend.tar.gz"

          ssh -p "${{ secrets.CPANEL_SSH_PORT || 22 }}" \
            "${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }}" \
            "FRONTEND_DIR='${{ secrets.CPANEL_FRONTEND_DIR }}' bash -s" <<'EOF'
          set -e
          mkdir -p "$FRONTEND_DIR"
          find "$FRONTEND_DIR" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          tar -xzf ~/frontend.tar.gz -C "$FRONTEND_DIR"
          rm -f ~/frontend.tar.gz
          EOF

      - name: Deploy api app
        shell: bash
        run: |
          scp -P "${{ secrets.CPANEL_SSH_PORT || 22 }}" \
            "${DEPLOY_DIR}/api-app.tar.gz" \
            "${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }}:~/api-app.tar.gz"

          ssh -p "${{ secrets.CPANEL_SSH_PORT || 22 }}" \
            "${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }}" \
            "API_APP_DIR='${{ secrets.CPANEL_API_APP_DIR }}' bash -s" <<'EOF'
          set -e
          mkdir -p "$API_APP_DIR"
          find "$API_APP_DIR" -mindepth 1 -maxdepth 1 \
            ! -name '.env' \
            ! -name 'storage' \
            -exec rm -rf {} +
          tar -xzf ~/api-app.tar.gz -C "$API_APP_DIR"
          rm -f ~/api-app.tar.gz
          EOF

      - name: Deploy api public docroot
        shell: bash
        run: |
          scp -P "${{ secrets.CPANEL_SSH_PORT || 22 }}" \
            "${DEPLOY_DIR}/api-public.tar.gz" \
            "${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }}:~/api-public.tar.gz"

          ssh -p "${{ secrets.CPANEL_SSH_PORT || 22 }}" \
            "${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }}" \
            "API_PUBLIC_DIR='${{ secrets.CPANEL_API_PUBLIC_DIR }}' bash -s" <<'EOF'
          set -e
          mkdir -p "$API_PUBLIC_DIR"
          find "$API_PUBLIC_DIR" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          tar -xzf ~/api-public.tar.gz -C "$API_PUBLIC_DIR"
          rm -f ~/api-public.tar.gz
          EOF

      - name: Finalize api release on server
        shell: bash
        run: |
          ssh -p "${{ secrets.CPANEL_SSH_PORT || 22 }}" \
            "${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }}" \
            "API_APP_DIR='${{ secrets.CPANEL_API_APP_DIR }}' API_PUBLIC_DIR='${{ secrets.CPANEL_API_PUBLIC_DIR }}' bash -s" <<'EOF'
          set -e

          cd "$API_APP_DIR"

          /usr/local/bin/ea-php82 /opt/cpanel/ea-wappspector/composer.phar install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-scripts

          if ! grep -Eq '^APP_KEY=.+$' .env; then
            /usr/local/bin/ea-php82 artisan key:generate --force
          fi

          /usr/local/bin/ea-php82 artisan migrate --force
          /usr/local/bin/ea-php82 artisan config:cache
          /usr/local/bin/ea-php82 artisan route:cache
          chmod -R ug+rw storage bootstrap/cache
          ln -sfn "$API_APP_DIR/storage/app/public" "$API_PUBLIC_DIR/storage"
          ln -sfn "$API_PUBLIC_DIR" "$HOME/public_html/api-inventory"

          cat > "$API_PUBLIC_DIR/.htaccess" <<'HTACCESS'
          AddHandler application/x-httpd-ea-php82 .php .php8 .phtml
          <IfModule mod_rewrite.c>
              <IfModule mod_negotiation.c>
                  Options -MultiViews -Indexes
              </IfModule>

              RewriteEngine On

              <IfModule mod_headers.c>
                  Header always set Access-Control-Allow-Origin "*"
                  Header always set Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS"
                  Header always set Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-Requested-With"
                  Header always set Access-Control-Max-Age "86400"
              </IfModule>

              RewriteCond %{REQUEST_METHOD} OPTIONS
              RewriteRule ^ - [R=204,L]

              RewriteCond %{HTTP:Authorization} .
              RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

              RewriteCond %{HTTP:x-xsrf-token} .
              RewriteRule .* - [E=HTTP_X_XSRF_TOKEN:%{HTTP:X-XSRF-Token}]

              RewriteCond %{REQUEST_FILENAME} !-d
              RewriteCond %{REQUEST_URI} (.+)/$
              RewriteRule ^ %1 [L,R=301]

              RewriteCond %{REQUEST_FILENAME} !-d
              RewriteCond %{REQUEST_FILENAME} !-f
              RewriteRule ^ index.php [L]
          </IfModule>
          HTACCESS

          perl -0pi -e "s#__DIR__\\.'/\\.\\./vendor/autoload\\.php'#__DIR__.'/../../../api.tuneboss.id/vendor/autoload.php'#g; s#__DIR__\\.'/\\.\\./bootstrap/app\\.php'#__DIR__.'/../../../api.tuneboss.id/bootstrap/app.php'#g; s#__DIR__\\.'/\\.\\./storage/framework/maintenance\\.php'#__DIR__.'/../../../api.tuneboss.id/storage/framework/maintenance.php'#g" "$API_PUBLIC_DIR/index.php"
          EOF
