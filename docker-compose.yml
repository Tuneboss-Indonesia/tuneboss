services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: tuneboss_inventory
      MARIADB_USER: tuneboss
      MARIADB_PASSWORD: ${DB_PASSWORD:?}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?}
      APP_URL: ${API_URL:-https://tuneboss.co.id}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: tuneboss_inventory
      DB_USERNAME: tuneboss
      DB_PASSWORD: ${DB_PASSWORD:?}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-tuneboss.co.id}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://tuneboss.co.id}
    expose:
      - "8000"

  frontend:
    build: .
    restart: unless-stopped
    ports:
      - "80:8080"

volumes:
  db_data:
